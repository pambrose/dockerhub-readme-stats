name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # formatDate() renders via toLocaleDateString, which depends on the
        # ICU data bundled with each Node build — worth testing across versions.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm test
